<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peztz 실시간 카메라</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #101828;
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #101828;
      }

      #message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        pointer-events: none;
      }
    </style>
    <script defer src="/cage-a1/reader.js"></script>
  </head>
  <body>
    <video id="video" controls muted autoplay playsinline></video>
    <div id="message">실시간 카메라에 연결하는 중입니다.</div>

    <script>
      const video = document.getElementById("video");
      const message = document.getElementById("message");
      let reader = null;

      window.addEventListener("load", () => {
        reader = new MediaMTXWebRTCReader({
          url: new URL("/cage-a1/whep", window.location.origin).toString(),
          onError: (error) => {
            message.textContent = error;
          },
          onTrack: (event) => {
            message.textContent = "";
            video.srcObject = event.streams[0];
          },
        });
      });

      window.addEventListener("beforeunload", () => {
        reader?.close();
      });
    </script>
  </body>
</html>
